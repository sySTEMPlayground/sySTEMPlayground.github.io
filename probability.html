<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Probability</title>
    <link rel="stylesheet" href="styles.css?v=course-colors" />
    <style>
      .course-header {
        display: flex;
        align-items: flex-start;
        gap: 30px;
        margin-bottom: 40px;
        padding: 0;
        background-color: transparent;
        border-radius: 0;
      }

      .course-icon {
        width: 100px;
        height: 100px;
        background-color: #001f3f;
        border-radius: 12px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        margin-left: -20px;
      }

      .course-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .course-info {
        flex: 1;
        padding-top: 0;
      }

      .course-name-header {
        display: none;
      }

      .teacher-label {
        font-size: 16px;
        color: #666;
        margin-bottom: 20px;
        margin-top: -10px;
      }

      .details-section {
        display: flex;
        gap: 15px;
        flex-wrap: nowrap;
        align-items: center;
      }

      .detail-oval {
        background-color: white;
        border: none;
        color: #001f3f;
        padding: 8px 20px;
        border-radius: 50px;
        font-weight: 600;
        font-size: 14px;
        text-align: center;
        white-space: nowrap;
        display: flex;
        align-items: center;
        justify-content: center;
        height: auto;
        min-width: auto;
        flex: 0 1 auto;
      }

      .course-detail-image {
        display: none;
      }

      .course-detail-copy {
        display: none;
      }

      .course-detail-actions {
        margin-top: 20px;
      }

      @media (max-width: 768px) {
        .course-header {
          flex-direction: column;
          align-items: flex-start;
        }

        .course-icon {
          margin-left: 0;
        }

        .details-section {
          flex-wrap: wrap;
        }

        .detail-oval {
          white-space: normal;
        }
      }
    </style>
  </head>
  <body class="course-page applied-math-page">
    <header class="site-header">
      <nav class="nav" aria-label="Main navigation">
        <a class="home-button" href="index.html" aria-label="Go to landing page">
          <img class="home-logo" src="images/logo.png" alt="Home logo" />
        </a>
        <div class="nav-right">
          <div class="dropdown">
            <button class="nav-button" type="button" aria-haspopup="true">Courses</button>
            <div class="dropdown-menu" role="menu" aria-label="Courses menu">
              <a class="dropdown-item" href="applied-math.html">Applied Math</a>
              <a class="dropdown-item" href="natural-sciences.html">Natural Sciences</a>
              <a class="dropdown-item" href="computer-science.html">Computer Science</a>
            </div>
          </div>
          <a class="nav-button nav-button--join" href="https://docs.google.com/forms/d/e/1FAIpQLSd5ZVvXKnXLlXVtzR3XfWHW_usxL_PZmFZ52zbIr6Bpo9z_eg/viewform?usp=dialog" target="_blank" rel="noopener noreferrer">Join</a>
          <a class="nav-button" href="about.html">About us</a>
          <a class="nav-button nav-button--donate" href="https://hcb.hackclub.com/donations/start/systemplayground" target="_blank" rel="noopener noreferrer">Donate</a>
        </div>
      </nav>
    </header>

    <main class="main">
      <article class="course-detail">
        <h1 class="course-page-title">Probability</h1>
        <p class="teacher-label">Teacher: <strong>Eva Fridman</strong></p>
        
        <!-- Learn More Section -->
        <div class="course-header">
          <div class="course-icon">
            <img src="images/course-probability.jpeg" alt="Probability course icon" />
          </div>
          <div class="course-info">
            <div class="details-section">
              <div class="detail-oval">Days met: 2</div>
              <div class="detail-oval">Time met: Coming soon!</div>
              <div class="detail-oval">Course length: Fall semester</div>
            </div>
          </div>
        </div>

        <div class="course-actions course-detail-actions">
          <a
            class="enroll-button"
            href="https://docs.google.com/forms/d/e/1FAIpQLScTeX3lxlH5HZyxFAChAcFfaxlbk_2HNuSK3nsHtZqFhIsrDw/viewform?usp=preview"
            target="_blank"
            rel="noopener noreferrer"
            >Enroll</a
          >
          <a class="learn-more-button" href="applied-math.html">Back to Courses</a>
        </div>
      </article>
    </main>
  </body>
</html>
